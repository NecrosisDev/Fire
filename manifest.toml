[plugin]
name = "Fire"
version = "0.1.0"
category = "Gameplay"

[script]
runtime = "com.necrosis.script-runtime"
entry = "scripts/main.lua"
requires = ["events.lifecycle", "timers"]
# world.read finds flammable props and the game's own fires; characters.read who stands where;
# inventory.read the player's held torch; events.combat torch and flaming-weapon hits; characters.damage
# and player.damage the burns; world.lights the glow on burning people; ui.sound the catch.
# world.fire (props burn with the game's fire) and effects.fire (flames on bodies) are requested
# (RUNTIME-REQUESTS.md); an unknown optional name is ignored until a runtime has it.
optional = ["world.read", "characters.read", "inventory.read", "events.combat", "characters.damage",
            "player.damage", "world.lights", "ui.sound", "world.fire", "effects.fire"]

[script.modules]
config = "scripts/config.lua"
flammables = "scripts/flammables.lua"
props = "scripts/props.lua"
people = "scripts/people.lua"
